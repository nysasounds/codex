name: codex
base: core24
summary: Codex - One agent for everywhere you code
adopt-info: codex
description: |
  Codex is OpenAI’s coding agent for software development. ChatGPT Plus,
  Pro, Business, Edu, and Enterprise plans include Codex.
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:
source-code: https://github.com/nysasounds/codex
issues: https://github.com/nysasounds/codex/issues
license: Apache-2.0

parts:
  codex:
    plugin: rust
    source: https://github.com/openai/codex.git
    source-tag: rust-v0.154.0
    source-depth: 1
    source-subdir: codex-rs
    override-pull: |
      craftctl default
      tag="$(git -C "${CRAFT_PART_SRC}" describe --tags --exact-match 2>/dev/null || git -C "${CRAFT_PART_SRC}" describe --tags --abbrev=0)"
      craftctl set version="${tag#rust-v}"

    rust-channel: stable
    rust-use-global-lto: false
    rust-cargo-parameters:
      - "--bin codex"
      - "--bin codex-code-mode-host"
    build-packages:
      - lld
      - pkg-config
      - libssl-dev
      - libclang-dev
      - libcap-dev
      - clang-20
      - libclang-20-dev
    stage-packages:
      - xdg-utils
    build-environment:
      - RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      - CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - CARGO_PROFILE_RELEASE_DEBUG: "0"
      - V8_FROM_SOURCE: "1"
      - LIBCLANG_PATH: "/usr/lib/llvm-20/lib"
      - GN_ARGS: "use_glib=false"
    override-build: |
      version="$(python3 "${CRAFT_PART_SRC}/.github/scripts/rusty_v8_bazel.py" resolved-v8-crate-version)"
      v8_dir="${CRAFT_PART_BUILD}/rusty_v8"
      rm -rf "${v8_dir}"
      git clone --depth 1 --branch "v${version}" --recurse-submodules --shallow-submodules \
        https://github.com/denoland/rusty_v8.git "${v8_dir}"
      printf '\n[patch.crates-io]\nv8 = { path = "%s" }\n' "${v8_dir}" >> "${CRAFT_PART_BUILD}/codex-rs/.cargo/config.toml"
      craftctl default
      # Include the current license info #
      install -d "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}"
      install "${CRAFT_PART_SRC}/LICENSE" "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}/"
      install "${CRAFT_PART_SRC}/NOTICE" "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}/"
    organize:
      codex: bin/codex
      codex-code-mode-host: bin/codex-code-mode-host
  # As this is a sctricly confined snap - include some commonly used utils #
  utils:
    plugin: nil
    stage-packages:
      - coreutils
      - curl
      - diffutils
      - fd-find
      - file
      - gawk
      - git
      - gnupg
      - grep
      - jq
      - less
      - openssh-client
      - openssl
      - patch
      - perl
      - ripgrep
      - rsync
      - sed
      - tar
      - tree
      - unzip
      - wget
      - yq
      - zip

  completer:
    plugin: nil
    override-build: |
      install -d "${CRAFT_PART_INSTALL}/usr/share/bash-completion"
      ${CRAFT_STAGE}/bin/codex completion bash > "${CRAFT_PART_INSTALL}/usr/share/bash-completion/codex"
    after:
      - codex

apps:
  codex:
    command: bin/codex
    completer: usr/share/bash-completion/codex
    environment:
      CODEX_HOME: $SNAP_USER_DATA
    plugs:
      - network
      - network-bind
      - desktop
      - home
