name: codex
base: core24
summary: Codex - One agent for everywhere you code
adopt-info: codex
description: |
  Codex is OpenAI’s coding agent for software development. ChatGPT Plus,
  Pro, Business, Edu, and Enterprise plans include Codex.
grade: stable
confinement: classic
platforms:
  amd64:
  arm64:
source-code: https://github.com/nysasounds/codex
issues: https://github.com/nysasounds/codex/issues
license: Apache-2.0

parts:
  codex:
    plugin: rust
    source: https://github.com/openai/codex.git
    source-tag: rust-v0.136.0
    source-depth: 1
    source-subdir: codex-rs
    override-pull: |
      craftctl default
      tag="$(git -C "${CRAFT_PART_SRC}" describe --tags --exact-match 2>/dev/null || git -C "${CRAFT_PART_SRC}" describe --tags --abbrev=0)"
      craftctl set version="${tag#rust-v}"

    rust-channel: stable
    rust-use-global-lto: false
    rust-cargo-parameters:
      - "--bin codex"
    build-packages:
      - lld
      - pkg-config
      - libssl-dev
      - libclang-dev
      - libcap-dev
    stage-packages:
      - bubblewrap
      - xdg-utils
    build-environment:
      - RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      - CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      - CARGO_PROFILE_RELEASE_DEBUG: "0"
    override-build: |
      craftctl default

      # Move main binary to expected location #
      install -d "${CRAFT_PART_INSTALL}/bin"
      mv "${CRAFT_PART_INSTALL}/codex" "${CRAFT_PART_INSTALL}/bin/codex"
      chmod 755 "${CRAFT_PART_INSTALL}/bin/codex"

      # Add argv0 helpers #
      ln -srf "${CRAFT_PART_INSTALL}/bin/codex" "${CRAFT_PART_INSTALL}/bin/apply_patch"
      ln -srf "${CRAFT_PART_INSTALL}/bin/codex" "${CRAFT_PART_INSTALL}/bin/applypatch"
      ln -srf "${CRAFT_PART_INSTALL}/bin/codex" "${CRAFT_PART_INSTALL}/bin/codex-linux-sandbox"
      ln -srf "${CRAFT_PART_INSTALL}/bin/codex" "${CRAFT_PART_INSTALL}/bin/codex-execve-wrapper"

      # Include the current license info #
      install -d "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}"
      install "${CRAFT_PART_SRC}/LICENSE" "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}/"
      install "${CRAFT_PART_SRC}/NOTICE" "${CRAFT_PART_INSTALL}/usr/share/doc/${CRAFT_PROJECT_NAME}/"
  launcher:
    plugin: dump
    source: snap/local
    override-build: |
      craftctl default
      chmod 755 "${CRAFT_PART_BUILD}/codex-wrapper"
      chmod 755 "${CRAFT_PART_BUILD}/migrate-codex-home"
    organize:
      codex-wrapper: bin/codex-wrapper
      migrate-codex-home: bin/migrate-codex-home

  completer:
    plugin: nil
    override-build: |
      install -d "${CRAFT_PART_INSTALL}/usr/share/bash-completion"
      ${CRAFT_STAGE}/bin/codex completion bash > "${CRAFT_PART_INSTALL}/usr/share/bash-completion/codex"
    after:
      - codex

apps:
  codex:
    command: bin/codex-wrapper
    completer: usr/share/bash-completion/codex
    environment:
      CODEX_HOME: $SNAP_USER_COMMON
